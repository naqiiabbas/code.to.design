<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scrolling popup fixture</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px; font: 14px/1.5 Arial, sans-serif; background: #f3f4f6; }

      /* A dropdown of the shape that loses its content today: a fixed-height
         list with far more rows than fit. */
      #popup {
        width: 320px;
        background: #ffffff;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
        overflow: hidden;
      }
      #popup-title {
        padding: 14px 16px;
        font-weight: 700;
        border-bottom: 1px solid #e5e7eb;
      }
      #list {
        height: 160px;
        overflow-y: auto;
        padding: 8px;
      }
      .row {
        padding: 10px 12px;
        border-radius: 8px;
        background: #f9fafb;
        margin-bottom: 6px;
      }
      #popup-footer {
        padding: 12px 16px;
        border-top: 1px solid #e5e7eb;
        color: #6b7280;
      }

      /* A horizontally scrolling strip, further down the page. */
      #strip {
        margin-top: 24px;
        width: 320px;
        overflow-x: auto;
        white-space: nowrap;
        background: #ffffff;
        border: 1px solid #d1d5db;
        padding: 10px;
      }
      .chip {
        display: inline-block;
        padding: 8px 14px;
        margin-right: 8px;
        border-radius: 999px;
        background: #eef2ff;
      }

      /* Something after the popup, to prove following content moves down. */
      #after { margin-top: 24px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="popup">
      <div id="popup-title">Assign a driver</div>
      <div id="list">
        <div class="row">Driver one</div>
        <div class="row">Driver two</div>
        <div class="row">Driver three</div>
        <div class="row">Driver four</div>
        <div class="row">Driver five</div>
        <div class="row">Driver six</div>
        <div class="row">Driver seven</div>
        <div class="row">Driver eight</div>
        <div class="row">Driver nine</div>
        <div class="row">Driver ten</div>
      </div>
      <div id="popup-footer">10 drivers available</div>
    </div>

    <div id="strip">
      <span class="chip">Sedan</span>
      <span class="chip">Estate</span>
      <span class="chip">Minibus</span>
      <span class="chip">Executive</span>
      <span class="chip">Wheelchair access</span>
      <span class="chip">Eight seater</span>
    </div>

    <div id="after">Content that follows the popup</div>
  </body>
</html>
