<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inner-scroller fixture</title>
    <style>
      /* The shape used by most dashboards and app shells: the window itself
         never scrolls, so window.scrollTo() does nothing at all. */
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body { font: 14px/1.4 Arial, sans-serif; background: #fff; }

      #shell { display: flex; height: 100%; }
      #sidebar { width: 180px; background: #1f2937; color: #fff; padding: 16px; flex: none; }
      #main { flex: 1; overflow-y: auto; padding: 20px; position: relative; }

      .card {
        height: 180px;
        margin-bottom: 16px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 16px;
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="sidebar">Sidebar</div>
      <div id="main">
        <h1 id="heading">Feed</h1>
        <div id="list"></div>
        <h2>Scroll-driven</h2>
        <div id="events"></div>
      </div>
    </div>

    <script>
      // 40 cards, each of which only fills in its text once it has been scrolled
      // into view. Nothing but a real scroll of #main will reveal them.
      const list = document.getElementById('list');
      const observer = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          const el = entry.target;
          if (!el.dataset.loaded) {
            el.dataset.loaded = '1';
            el.textContent = `Card ${el.dataset.index} loaded`;
          }
        }
      }, { root: document.getElementById('main'), rootMargin: '100px' });

      for (let i = 1; i <= 40; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = String(i);
        card.textContent = '';
        list.appendChild(card);
        observer.observe(card);
      }
      // A second mechanism: these only fill in from a scroll EVENT on #main.
      // Expanding the container cannot trigger that - only a real scroll can.
      const events = document.getElementById('events');
      const main = document.getElementById('main');
      const eventCards = [];
      for (let i = 1; i <= 10; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = String(i);
        events.appendChild(card);
        eventCards.push(card);
      }
      main.addEventListener('scroll', () => {
        const limit = main.scrollTop + main.clientHeight;
        for (const el of eventCards) {
          if (!el.dataset.loaded && el.offsetTop < limit) {
            el.dataset.loaded = '1';
            el.textContent = 'Scroll card ' + el.dataset.index + ' loaded';
          }
        }
      });

      window.__fixtureReady = true;
    </script>
  </body>
</html>
